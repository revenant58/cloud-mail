name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mail-vue/pnpm-lock.yaml

      - name: Install Vue dependencies
        run: pnpm --prefix mail-vue install --frozen-lockfile

      - name: Build Vue
        # Mode release → VITE_OUT_DIR = ../mail-worker/dist (output langsung ke worker)
        run: pnpm --prefix mail-vue run build

      - name: Install Worker dependencies
        run: pnpm --prefix mail-worker install --frozen-lockfile

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: mail-worker
          wranglerVersion: '3'
